name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04_Desarrollo_Codigo/src/package-lock.json
      - name: Instalar dependencias
        run: npm install --prefix 04_Desarrollo_Codigo/src
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build
